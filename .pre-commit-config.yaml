repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mirrors-prettier is archived; the repo's own prettier from package.json runs instead.
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude: ^(custom_components/|test_config/)
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        files: \.(ts|mjs|js)$
        exclude: ^(custom_components/|dist/)
