name: Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The oldest core this job is willing to call a valid run, and the minimum
  # hacs.json declares - HACS must not offer the integration to a core CI never
  # tested. Raise both together (tests/test_packaging.py checks they match).
  # See the "Report and check the resolved core" step.
  MINIMUM_CORE: '2026.9.3'

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest-homeassistant-custom-component beautifulsoup4 lxml pytest pytest-asyncio pytest-socket aiohttp

      - name: Report and check the resolved core
        run: |
          # The install step pins nothing, and
          # pytest-homeassistant-custom-component pins an *exact* homeassistant.
          # So the core under test is chosen by the resolver, not by this repo,
          # and it can move without a commit. Print it so every run says which
          # core it tested, and fail if the resolver has quietly walked backwards
          # to an older one instead of erroring out.
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import requires, version

          from packaging.requirements import Requirement
          from packaging.version import Version

          core = version("homeassistant")
          phcc = version("pytest-homeassistant-custom-component")
          floor = os.environ["MINIMUM_CORE"]

          print(f"python                                = {sys.version.split()[0]}")
          print(f"homeassistant                         = {core}")
          print(f"pytest-homeassistant-custom-component = {phcc}")
          print(f"minimum core this job accepts         = {floor}")

          failures = []

          if Version(core) < Version(floor):
              failures.append(
                  f"homeassistant {core} is older than the required {floor}. The "
                  "resolver backtracked instead of failing - usually because the "
                  "interpreter is too old for the current core, which makes an "
                  "unsatisfiable pin look like a satisfiable older one."
              )

          # The exact pin is the mechanism behind that backtracking, so name it
          # rather than leaving a mismatch to be puzzled out from two versions.
          pinned = [
              Requirement(r)
              for r in (requires("pytest-homeassistant-custom-component") or [])
              if Requirement(r).name == "homeassistant"
          ]
          for requirement in pinned:
              if not requirement.specifier.contains(core, prereleases=True):
                  failures.append(
                      f"pytest-homeassistant-custom-component {phcc} pins "
                      f"homeassistant{requirement.specifier}, but {core} is installed."
                  )

          if failures:
              print()
              for failure in failures:
                  print(f"error: {failure}")
              raise SystemExit(1)

          print("\nok: testing against the current core.")
          PY

      - name: Run tests (offline)
        run: |
          # Run the full test suite offline. Network calls are blocked by pytest-socket
          PYTHONPATH=. pytest tests

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install and test frontend
        run: |
          npm ci
          npm run check-format
          npm run lint
          npm run test
          npm run build
          if ! git diff --exit-code -- custom_components/seatemperatures/sea-temperatures-card.js; then
            echo "::error::custom_components/seatemperatures/sea-temperatures-card.js is stale. Run npm run build and commit the result."
            exit 1
          fi

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff linter
        run: |
          ruff check .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build the card
        run: npm run build

      - name: Start Home Assistant
        run: docker compose up -d

      - name: Wait for Home Assistant
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8125/manifest.json; then
              echo "Home Assistant is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Home Assistant did not answer on port 8125 within 450 s."
          docker compose logs --tail 100
          exit 1

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Home Assistant log
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop Home Assistant
        if: always()
        run: docker compose down
