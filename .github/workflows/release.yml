name: Create Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v7

      # 2. Get version from tag
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 3. Sync versions across files
      - name: Sync version numbers
        run: |
          # Remove 'v' prefix if present (e.g., v1.2.0 -> 1.2.0)
          CLEAN_VERSION=${VERSION#v}
          echo "Setting versions to $CLEAN_VERSION"

          # Update Home Assistant manifest
          jq ".version = \"$CLEAN_VERSION\"" custom_components/seatemperatures/manifest.json > tmp.json && mv tmp.json custom_components/seatemperatures/manifest.json

          # Update pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$CLEAN_VERSION\"/" pyproject.toml

          # Update package.json
          npm version $CLEAN_VERSION --no-git-tag-version --allow-same-version

          # Update the cache-busting query in the YAML-mode resource example.
          # Anchored on the bundle filename plus "?v=" and a leading digit, so a
          # plain mention of the file elsewhere in the README is left alone.
          sed -i "s|sea-temperatures-card\.js?v=[0-9][0-9A-Za-z.-]*|sea-temperatures-card.js?v=$CLEAN_VERSION|g" README.md
          grep -q "sea-temperatures-card.js?v=$CLEAN_VERSION" README.md \
            || { echo "README resource example was not rewritten - did the path change?"; exit 1; }

      # 4. Setup Node and Build Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # 5. Commit versions and compiled JS back to repository
      - name: Commit version bump and move tag
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pyproject.toml custom_components/seatemperatures/manifest.json package.json package-lock.json README.md custom_components/seatemperatures/sea-temperatures-card.js
          git commit -m "chore: release ${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
          git tag -f ${{ env.VERSION }}
          git push origin -f refs/tags/${{ env.VERSION }}

      # 4. Create ZIP in repo root (only sea-temperatures folder)
      - name: Create zip archive for HACS
        run: |
          cd custom_components/seatemperatures
          zip -r ../../sea-temperatures.zip .

      # 5. Verify ZIP exists
      - name: List files
        run: ls -l sea-temperatures.zip

      # 6. Create GitHub Release and attach ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: 'Version ${{ env.VERSION }}'
          draft: true
          generate_release_notes: true
          files: sea-temperatures.zip
